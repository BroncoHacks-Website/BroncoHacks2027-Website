# Application-prod.properties (PostgreSQL)

spring.profiles.active=prod

# Datasource (Use env variables for credentials)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:broncohacks}
spring.datasource.driverClassName=org.postgresql.Driver

# Credentials are NOT hardcoded
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#JPA/Hibernate
# Ensure schema matches entities
spring.jpa.hibernate.ddl-auto=validate

# Disable SQL logging in production
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false